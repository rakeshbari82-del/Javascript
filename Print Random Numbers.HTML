<!DOCTYPE html>
<html>
    <body>
        <h2>Javascript While Loop</h2>
        <p id="number"></p>
        <script>
            
            var text = "";
            var  i =51;
            while (i < 56)
        {
            text += "<br>The value of the number is " + i;
            i++;
        }
            var  i =101;
            while (i <= 105)
        {
            text += "<br><br>The value of the number of the three digit is " + i;
            i++;
        }
        
        var  i =91;
            while (i < 92)
        {
            text += "<br><br>90 + 1 = " + i;
            i++;
        }

        var  i =92;
            while (i < 93)
        {
            text += "<br><br>90 + 2 = " + i;
            i++;
        }
        
        var  i =93;
            while (i < 94)
        {
            text += "<br><br>90 + 3 = " + i;
            i++;
        }
        
        var  i =94;
            while (i < 95)
        {
            text += "<br><br>90 + 4 = " + i;
            i++;
        }

        var  i =95;
            while (i < 96)
        {
            text += "<br><br>90 + 5 = " + i;
            i++;
        }

        var  i =8;
            while (i < 9)
        {
            text += "<br><br>2 * 4 = " + i;
            i++;
        }

        var  i =12;
            while (i <= 12)
        {
            text += "<br><br>2 * 6 = " + i;
            i++;
        }

        document.getElementById("number").innerHTML = text;
        
        </script>
    </body>
</html>
