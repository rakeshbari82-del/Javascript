<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style_Stop_Changing_Numbers.CSS">
    </head>
    
    <body>
        
        <div>Click on the number...</div>
        <div id="number" onclick="stopStart()"></div>

        <script>
        var stopped = false;   // ✅ fixed spelling
        var t;
        var number;

        function change() 
        {
            var random = Math.floor(Math.random() * 10) + 1;
            number.innerHTML = random;
        }

        function stopStart() 
        {
            if (stopped) 
            {
                stopped = false;
                t = setInterval(change, 100);
            } 
            else 
            {
                clearInterval(t);
                stopped = true;
            }
        }

        window.onload = function() 
        {
            number = document.getElementById("number");
            t = setInterval(change, 100);
        }
        </script>
        
    </body>
</html>
